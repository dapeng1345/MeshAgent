name: Windows Build

run-name: Build Windows versions of MeshAgent

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: ${{ matrix.platform == 'ARM64' && 'windows-11-arm' || 'windows-2022' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86, ARM64]
    steps:
    - uses: actions/checkout@v7
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v3
    - name: Stamp executable version
      shell: pwsh
      run: |
        $buildNumber = [int]$env:GITHUB_RUN_NUMBER
        $version = "1.57.$($buildNumber % 65535).0"
        $versionComma = $version.Replace('.', ',')
        Get-ChildItem -Path . -Recurse -Filter *.rc | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          $content = [regex]::Replace($content, 'FILEVERSION\s+[0-9,]+', "FILEVERSION $versionComma")
          $content = [regex]::Replace($content, 'VALUE "FileVersion",\s*"[^"]*"', ('VALUE "FileVersion", "' + $version + '"'))
          $content = [regex]::Replace($content, 'VALUE "ProductVersion",\s*"[^"]*"', ('VALUE "ProductVersion", "' + $version + '"'))
          Set-Content -Path $_.FullName -Value $content -NoNewline
        }
        "file_version=$version" | Out-File build-version.txt -Encoding utf8
    - name: Build ${{ matrix.platform }}
      run: msbuild MeshAgent-2022.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }}
    - name: Upload ${{ matrix.platform }} artifacts
      uses: actions/upload-artifact@v7
      with:
        name: meshagent-windows-${{ matrix.platform }}
        path: |
          **/Release/*.exe
          **/Release/*.dll
          build-version.txt
        if-no-files-found: error

    - name: Write build manifest
      if: always()
      shell: pwsh
      run: |
        $files = Get-ChildItem -Path . -Recurse -File -Include *.exe,*.dll |
          Where-Object { $_.FullName -match '\\Release\\' }
        "commit=$env:GITHUB_SHA" | Out-File build-manifest.txt -Encoding utf8
        "run=$env:GITHUB_RUN_ID" | Add-Content build-manifest.txt
        "platform=${{ matrix.platform }}" | Add-Content build-manifest.txt
        "built=$(Get-Date -Format o)" | Add-Content build-manifest.txt
        foreach ($file in $files) {
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash
          "$hash  $($file.FullName)" | Add-Content build-manifest.txt
        }
    - name: Upload build manifest
      uses: actions/upload-artifact@v7
      with:
        name: meshagent-windows-${{ matrix.platform }}-manifest
        path: build-manifest.txt
