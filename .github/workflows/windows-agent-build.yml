name: Windows Agent Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'agent/MeshAgent/**'
      - '.github/workflows/windows-agent-build.yml'
  pull_request:
    paths:
      - 'agent/MeshAgent/**'
      - '.github/workflows/windows-agent-build.yml'

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, x86]
    defaults:
      run:
        working-directory: agent/MeshAgent
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build MeshAgent
        run: msbuild MeshAgent-2022.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Collect binaries and manifest
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File -Include *.exe,*.dll |
            Where-Object { $_.FullName -match '\\Release\\' }
          if ($files.Count -eq 0) { throw 'No Release binaries were produced.' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($file in $files) {
            Copy-Item $file.FullName artifacts -Force
          }
          "commit=$env:GITHUB_SHA" | Out-File artifacts/build-manifest.txt -Encoding utf8
          "run=$env:GITHUB_RUN_ID" | Add-Content artifacts/build-manifest.txt
          "platform=${{ matrix.platform }}" | Add-Content artifacts/build-manifest.txt
          "built=$(Get-Date -Format o)" | Add-Content artifacts/build-manifest.txt
          Get-ChildItem artifacts -File -Include *.exe,*.dll | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash
            "$hash  $($_.Name)" | Add-Content artifacts/build-manifest.txt
          }

      - name: Upload Windows Agent artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshagent-windows-${{ matrix.platform }}-${{ github.sha }}
          path: agent/MeshAgent/artifacts/*
          if-no-files-found: error
